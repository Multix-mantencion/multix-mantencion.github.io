<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1721" />
<title>MultiX Mantención</title>
<style>
:root{--bg:#07131c;--panel:#0d1d29;--panel2:#122635;--line:#20394a;--text:#edf5f7;--muted:#8295a3;--teal:#32c6ad;--orange:#ffad2f;--red:#ff4f55;--violet:#a77af4;--blue:#4ab6e8;--ok:#55c8a8;--white:#fff;--navy:#0c2d50}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh}.app{max-width:1100px;margin:auto;padding:16px 16px 96px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 0 18px}.brand{display:flex;align-items:center;gap:12px}.brand img{height:30px;background:white;border-radius:5px;padding:2px 6px}.sync{font-size:13px;color:var(--muted)}h1{font-size:28px;line-height:1.1;margin:6px 0 22px;letter-spacing:.2px}.meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#0a1924;color:var(--text);padding:12px 12px;border-radius:10px;font-size:15px;outline:none}.field textarea{min-height:80px;resize:vertical}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:18px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;text-align:center}.stat .n{font-size:25px;font-weight:800}.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:4px}.stat.warn .n{color:var(--red)}.tabs{display:flex;gap:8px;overflow:auto;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,19,28,.96);backdrop-filter:blur(10px);z-index:20;padding:9px 0}.tab{border:0;background:transparent;color:var(--muted);padding:11px 13px;border-radius:9px;font-size:14px;white-space:nowrap}.tab.active{background:var(--panel2);color:var(--text)}.section{display:none;padding-top:16px}.section.active{display:block}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.panel h2{font-size:17px;margin:0 0 14px}.alert{border:1px solid #8e6416;background:#2a2212;border-radius:12px;padding:12px;margin:8px 0;color:#ffd27d}.attention{border-left:4px solid var(--red);padding-left:12px;margin:10px 0}.center-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.center-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;cursor:pointer}.center-card:active{transform:scale(.995)}.center-card h3{margin:0 0 8px}.badges{display:flex;flex-wrap:wrap;gap:6px}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#183344;color:#cce3ed}.badge.red{background:#4a2025;color:#ffb9bc}.badge.orange{background:#4a3514;color:#ffd995}.badge.green{background:#163b34;color:#a9e5d5}.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 14px;border-radius:11px;font-weight:650;cursor:pointer}.btn.primary{background:var(--teal);border-color:var(--teal);color:#06211c}.btn.danger{border-color:#6c2c31;color:#ffb9bc;background:#32181b}.btn.orange{background:#4b3514;border-color:#7a5a1d;color:#ffd27d}.btn.small{padding:8px 10px;font-size:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}th{font-size:10px;text-transform:uppercase;color:var(--muted)}.status{font-weight:800}.status.OK,.status.Operativo,.status.Recibido{color:var(--ok)}.status.Vencido,.status.Inoperativo{color:var(--red)}.status.Próximo,.status.Solicitado,.status.En\ observación{color:var(--orange)}.editor{position:fixed;inset:0;background:#06111a;z-index:80;overflow:auto;display:none}.editor.open{display:block}.editor-inner{max-width:900px;margin:auto;padding:14px 14px 100px}.editor-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#06111a;z-index:4;padding:10px 0 12px;border-bottom:1px solid var(--line)}.editor h2{margin:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.subhead{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--teal);margin:20px 0 10px}.eqrow{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}.eqrow input,.eqrow select{width:100%;background:#0a1924;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:9px}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo{position:relative}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.photo button{position:absolute;top:5px;right:5px;border:0;border-radius:50%;width:28px;height:28px;background:#220b0d;color:white}.history-item{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);padding:12px;border-radius:12px;margin-bottom:8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(7,19,28,.97);border-top:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));z-index:30}.bottom-inner{max-width:1100px;margin:auto;display:flex;gap:8px}.bottom .btn{flex:1}.empty{color:var(--muted);font-size:14px;padding:18px;text-align:center}.req-form{display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr 1fr 1fr auto;gap:8px;align-items:end}.req-form input,.req-form select{width:100%;background:#0a1924;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:9px}.helper{font-size:12px;color:var(--muted)}#printReport{display:none}
@media(max-width:760px){.app{padding:12px 12px 110px}h1{font-size:25px}.meta-grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}.center-list{grid-template-columns:1fr}.grid2,.grid3{grid-template-columns:1fr}.eqrow{grid-template-columns:1fr 1fr}.req-form{grid-template-columns:1fr 1fr}.photo-grid{grid-template-columns:repeat(2,1fr)}.brand img{height:28px}}
@media print{body{background:white;color:#111}.app,.bottom,.editor{display:none!important}#printReport{display:block!important;padding:18mm 16mm;font-family:Arial,sans-serif;color:#101923}.pr-logo{height:32px;margin-bottom:12px}.pr-title{font-size:20px;font-weight:800;margin:0}.pr-sub{font-size:11px;color:#59636c;margin:3px 0 14px}.pr-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:10px;border-bottom:2px solid #152333;padding-bottom:12px;margin-bottom:16px}.pr-meta b{display:block;font-size:9px;margin-bottom:4px}.pr-center{break-inside:avoid;margin-bottom:20px}.pr-center h2{font-size:15px;margin:0 0 10px}.pr-section{margin:9px 0}.pr-section h3{font-size:10px;color:#0f7e90;margin:0 0 4px;text-transform:uppercase}.pr-section p,.pr-section li{font-size:10px;line-height:1.35}.pr-table{width:100%;border-collapse:collapse;min-width:0}.pr-table th,.pr-table td{font-size:9px;padding:5px 4px;border-bottom:1px solid #d7dde1;color:#111}.pr-table th{color:#505961}.pr-photos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.pr-photos img{width:100%;max-height:170px;object-fit:cover}.page-break{break-before:page}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><div class="brand"><span style="font-weight:800;letter-spacing:1px">MULTI X</span><span>Área Mantención</span></div><div class="sync" id="saveState">Guardado local</div></div>
  <h1>INFORME TÉCNICO SEMANAL DE MANTENCIÓN</h1>
  <div class="meta-grid">
    <div class="field"><label>Inicio periodo</label><input id="startDate" type="date"></div>
    <div class="field"><label>Fin periodo</label><input id="endDate" type="date"></div>
    <div class="field"><label>Zona</label><input id="zone" value="Puyuhuapi / Base Cisnes"></div>
    <div class="field"><label>Mecánico en el área</label><input id="mechanic" placeholder="Nombre"></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <button class="tab active" data-tab="summary">Resumen</button>
    <button class="tab" data-tab="centers">Centros</button>
    <button class="tab" data-tab="feeding">Alimentación</button>
    <button class="tab" data-tab="requests">Solicitudes</button>
    <button class="tab" data-tab="history">Historial</button>
  </div>
  <section class="section active" id="summary"><div class="panel"><h2>Resumen general</h2><div id="summaryAlerts"></div></div><div class="panel"><h2>Requieren atención</h2><div id="attentionList"></div></div></section>
  <section class="section" id="centers"><div class="center-list" id="centerList"></div></section>
  <section class="section" id="feeding"><div class="panel"><h2>Estado del sistema de alimentación</h2><div id="feedingList"></div></div></section>
  <section class="section" id="requests"><div class="panel"><h2>Nueva solicitud</h2><div class="req-form"><select id="rCenter"></select><input id="rEquip" placeholder="Equipo"><input id="rMaterial" placeholder="Material / repuesto"><input id="rTo" placeholder="Solicitado a"><input id="rDate" type="date"><select id="rStatus"><option>Solicitado</option><option>En curso</option><option>Recibido</option></select><button class="btn primary" id="addRequest">Agregar</button></div></div><div class="panel"><h2>Solicitudes y requerimientos</h2><div id="requestList"></div></div></section>
  <section class="section" id="history"><div class="panel"><h2>Historial de informes</h2><div class="btnrow"><button class="btn" id="backupBtn">Descargar respaldo</button><label class="btn" for="restoreInput">Cargar respaldo</label><input id="restoreInput" type="file" accept="application/json" hidden></div><div id="historyList"></div></div></section>
</div>
<div class="editor" id="editor"><div class="editor-inner"><div class="editor-head"><h2 id="editorTitle"></h2><button class="btn" id="closeEditor">Cerrar</button></div><div class="grid2"><div class="field"><label>Novedades</label><textarea id="cNov"></textarea></div><div class="field"><label>Trabajos realizados</label><textarea id="cWorks"></textarea></div><div class="field"><label>Trabajos pendientes</label><textarea id="cPending"></textarea></div><div class="field"><label>Empresas en terreno</label><textarea id="cCompanies"></textarea></div></div><div class="subhead">Equipos</div><div id="equipmentEditor"></div><button class="btn" id="addEquipment">+ Agregar equipo</button><div class="subhead">Plantas</div><div class="grid2"><div class="field"><label>Ósmosis</label><select id="osmosisStatus"><option>Sin información</option><option>Operativa</option><option>En observación</option><option>Inoperativa</option></select><textarea id="osmosisDetail" placeholder="Detalle"></textarea></div><div class="field"><label>Tratamiento</label><select id="treatmentStatus"><option>Sin información</option><option>Operativa</option><option>En observación</option><option>Inoperativa</option></select><textarea id="treatmentDetail" placeholder="Detalle"></textarea></div></div><div class="subhead">Sistema de alimentación</div><div class="grid3"><div class="field"><label>Blower</label><select id="fBlower"><option>Sin información</option><option>Operativo</option><option>En observación</option><option>Inoperativo</option></select></div><div class="field"><label>Selectoras</label><select id="fSelectors"><option>Sin información</option><option>Operativo</option><option>En observación</option><option>Inoperativo</option></select></div><div class="field"><label>Doser</label><select id="fDosers"><option>Sin información</option><option>Operativo</option><option>En observación</option><option>Inoperativo</option></select></div><div class="field"><label>Tornillo</label><select id="fScrew"><option>Sin información</option><option>Operativo</option><option>En observación</option><option>Inoperativo</option></select></div><div class="field"><label>Variadores</label><select id="fVfd"><option>Sin información</option><option>Operativo</option><option>En observación</option><option>Inoperativo</option></select></div></div><div class="field"><label>Observaciones alimentación</label><textarea id="fNotes"></textarea></div><div class="subhead">Fotografías</div><input id="photoInput" type="file" accept="image/*" multiple><div class="photo-grid" id="photoGrid"></div><div class="field"><label>Observaciones generales</label><textarea id="cObs"></textarea></div><div class="btnrow"><button class="btn primary" id="saveCenter">Guardar centro</button></div></div></div>
<div class="bottom"><div class="bottom-inner"><button class="btn" id="newBtn">Nuevo informe</button><button class="btn primary" id="saveBtn">Guardar</button><button class="btn orange" id="pdfBtn">Informe PDF</button></div></div>
<div id="printReport"></div>
<script>
const CENTER_NAMES=['Ganso','Puyuhuapi 2','Puyuhuapi 1','Pearson','Delta','Arbolito','Camargo','Yelen','Yalac','Refugio'];
function centerTemplate(){return{novelties:'',works:'',pending:'',companies:'',observations:'',equipment:[],plants:{osmosis:{status:'Sin información',detail:''},treatment:{status:'Sin información',detail:''}},feeding:{blower:'Sin información',selectors:'Sin información',dosers:'Sin información',screw:'Sin información',vfd:'Sin información',notes:''},photos:[]}}
function newReport(){const centers={};CENTER_NAMES.forEach(n=>centers[n]=centerTemplate());return{meta:{start:'',end:'',zone:'Puyuhuapi / Base Cisnes',mechanic:'',area:'Operaciones'},centers,requests:[],history:[]}}
let data;try{data=JSON.parse(localStorage.getItem('multixMantencion')||'null')}catch(e){data=null}if(!data||!data.centers)data=newReport();CENTER_NAMES.forEach(n=>{if(!data.centers[n])data.centers[n]=centerTemplate()});if(!Array.isArray(data.requests))data.requests=[];if(!Array.isArray(data.history))data.history=[];
const $=id=>document.getElementById(id);const startDate=$('startDate'),endDate=$('endDate'),zone=$('zone'),mechanic=$('mechanic'),stats=$('stats'),summaryAlerts=$('summaryAlerts'),attentionList=$('attentionList'),centerList=$('centerList'),feedingList=$('feedingList'),requestList=$('requestList'),historyList=$('historyList'),editor=$('editor'),editorTitle=$('editorTitle'),cNov=$('cNov'),cWorks=$('cWorks'),cPending=$('cPending'),cCompanies=$('cCompanies'),cObs=$('cObs'),equipmentEditor=$('equipmentEditor'),photoGrid=$('photoGrid'),photoInput=$('photoInput'),osmosisStatus=$('osmosisStatus'),osmosisDetail=$('osmosisDetail'),treatmentStatus=$('treatmentStatus'),treatmentDetail=$('treatmentDetail'),fBlower=$('fBlower'),fSelectors=$('fSelectors'),fDosers=$('fDosers'),fScrew=$('fScrew'),fVfd=$('fVfd'),fNotes=$('fNotes'),rCenter=$('rCenter'),rEquip=$('rEquip'),rMaterial=$('rMaterial'),rTo=$('rTo'),rDate=$('rDate'),rStatus=$('rStatus'),printReport=$('printReport');let currentCenter=null;
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function attr(s=''){return esc(s)}function sel(a,b){return a===b?' selected':''}
function save(){syncMeta();try{localStorage.setItem('multixMantencion',JSON.stringify(data));$('saveState').textContent='Guardado local';renderAll()}catch(e){alert('No se pudo guardar. Si agregaste muchas fotos, prueba eliminando algunas.')}}
function syncMeta(){data.meta.start=startDate.value;data.meta.end=endDate.value;data.meta.zone=zone.value;data.meta.mechanic=mechanic.value}
function init(){startDate.value=data.meta.start||'';endDate.value=data.meta.end||'';zone.value=data.meta.zone||'Puyuhuapi / Base Cisnes';mechanic.value=data.meta.mechanic||'';rCenter.innerHTML=CENTER_NAMES.map(n=>`<option>${n}</option>`).join('');renderAll()}
function renderAll(){renderStats();renderSummary();renderCenters();renderFeeding();renderRequests();renderHistory()}
function renderStats(){let eq=0,venc=0,gen=0,botes=0,moto=0;CENTER_NAMES.forEach(n=>data.centers[n].equipment.forEach(e=>{eq++;if(e.status==='Vencido')venc++;const t=(e.type||e.name||'').toLowerCase();if(t.includes('generador'))gen++;if(t.includes('bote'))botes++;if(t.includes('motocompresor'))moto++}));stats.innerHTML=[['Centros',CENTER_NAMES.length],['Equipos',eq],['Generadores',gen],['Botes',botes],['Motocompresores',moto],['Vencidos',venc,true]].map(x=>`<div class="stat ${x[2]?'warn':''}"><div class="n">${x[1]}</div><div class="l">${x[0]}</div></div>`).join('')}
function renderSummary(){const alerts=[];const att=[];CENTER_NAMES.forEach(n=>{const c=data.centers[n];if(c.feeding.notes)alerts.push(`<div class="alert"><b>${n}</b> — ${esc(c.feeding.notes)}</div>`);c.equipment.forEach(e=>{if(['Vencido','Inoperativo','En observación','Próximo'].includes(e.status))att.push(`<div class="attention"><b>${n}</b> — ${esc(e.name||e.type)} <span class="status ${e.status}">${esc(e.status)}</span>${e.notes?`<div class="helper">${esc(e.notes)}</div>`:''}</div>`)});['osmosis','treatment'].forEach(k=>{const p=c.plants[k];if(['Inoperativa','En observación'].includes(p.status))att.push(`<div class="attention"><b>${n}</b> — ${k==='osmosis'?'Planta de Ósmosis':'Planta de Tratamiento'} <span class="status ${p.status}">${esc(p.status)}</span>${p.detail?`<div class="helper">${esc(p.detail)}</div>`:''}</div>`)})});summaryAlerts.innerHTML=alerts.join('')||'<div class="empty">Sin novedades destacadas en alimentación.</div>';attentionList.innerHTML=att.join('')||'<div class="empty">No hay equipos marcados para atención.</div>'}
function renderCenters(){centerList.innerHTML=CENTER_NAMES.map(n=>{const c=data.centers[n],bad=c.equipment.filter(e=>['Vencido','Inoperativo'].includes(e.status)).length,obs=c.equipment.filter(e=>['Próximo','En observación'].includes(e.status)).length;return `<div class="center-card" data-center="${attr(n)}"><h3>${esc(n)}</h3><div class="badges"><span class="badge">${c.equipment.length} equipos</span>${bad?`<span class="badge red">${bad} críticos</span>`:''}${obs?`<span class="badge orange">${obs} seguimiento</span>`:''}${c.photos.length?`<span class="badge green">${c.photos.length} fotos</span>`:''}</div><div class="helper" style="margin-top:8px">Toca para abrir y editar</div></div>`}).join('');document.querySelectorAll('.center-card').forEach(el=>el.onclick=()=>openCenter(el.dataset.center))}
function renderFeeding(){feedingList.innerHTML=CENTER_NAMES.map(n=>{const f=data.centers[n].feeding;const items=[['Blower',f.blower],['Selectoras',f.selectors],['Doser',f.dosers],['Tornillo',f.screw],['Variadores',f.vfd]].filter(x=>x[1]&&x[1]!=='Sin información');if(!items.length&&!f.notes)return'';return `<div class="panel"><h2>${esc(n)}</h2><div class="badges">${items.map(x=>`<span class="badge">${x[0]}: ${esc(x[1])}</span>`).join('')}</div>${f.notes?`<p>${esc(f.notes)}</p>`:''}</div>`}).join('')||'<div class="empty">Aún no hay información de alimentación.</div>'}
function renderRequests(){requestList.innerHTML=data.requests.length?`<div class="tablewrap"><table><thead><tr><th>Centro</th><th>Equipo</th><th>Material / repuesto</th><th>Solicitado a</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody>${data.requests.map((r,i)=>`<tr><td>${esc(r.center)}</td><td>${esc(r.equipment)}</td><td>${esc(r.material)}</td><td>${esc(r.requestedTo)}</td><td>${esc(r.date)}</td><td class="status ${r.status}">${esc(r.status)}</td><td><button class="btn small danger" onclick="delRequest(${i})">×</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sin solicitudes registradas.</div>'}
function renderHistory(){historyList.innerHTML=data.history.length?data.history.map((h,i)=>`<div class="history-item"><div><b>${esc(h.meta?.start||'')} — ${esc(h.meta?.end||'')}</b><div class="helper">${esc(h.meta?.mechanic||'Sin mecánico')}</div></div><button class="btn small" onclick="restoreHistory(${i})">Abrir</button></div>`).join(''):'<div class="empty">Aún no hay informes archivados.</div>'}
function openCenter(name){currentCenter=name;const c=data.centers[name];editorTitle.textContent=name;cNov.value=c.novelties;cWorks.value=c.works;cPending.value=c.pending;cCompanies.value=c.companies;cObs.value=c.observations;osmosisStatus.value=c.plants.osmosis.status;osmosisDetail.value=c.plants.osmosis.detail;treatmentStatus.value=c.plants.treatment.status;treatmentDetail.value=c.plants.treatment.detail;fBlower.value=c.feeding.blower;fSelectors.value=c.feeding.selectors;fDosers.value=c.feeding.dosers;fScrew.value=c.feeding.screw;fVfd.value=c.feeding.vfd;fNotes.value=c.feeding.notes;renderEqEditor();renderPhotos();editor.classList.add('open')}
function closeCenter(){editor.classList.remove('open')}
function renderEqEditor(){const c=data.centers[currentCenter];equipmentEditor.innerHTML=c.equipment.map((e,i)=>`<div class="eqrow"><input data-i="${i}" data-k="name" value="${attr(e.name)}" placeholder="Equipo"><input data-i="${i}" data-k="current" value="${attr(e.current)}" placeholder="Actual"><input data-i="${i}" data-k="last" value="${attr(e.last)}" placeholder="Últ. mant."><input data-i="${i}" data-k="next" value="${attr(e.next)}" placeholder="Próxima"><select data-i="${i}" data-k="status"><option${sel(e.status,'OK')}>OK</option><option${sel(e.status,'Próximo')}>Próximo</option><option${sel(e.status,'Vencido')}>Vencido</option><option${sel(e.status,'Operativo')}>Operativo</option><option${sel(e.status,'Inoperativo')}>Inoperativo</option><option${sel(e.status,'En observación')}>En observación</option></select><button class="btn small danger" onclick="delEq(${i})">×</button><input data-i="${i}" data-k="type" value="${attr(e.type)}" placeholder="Tipo (Generador, Bote...)" style="grid-column:1/3"><input data-i="${i}" data-k="reg" value="${attr(e.reg)}" placeholder="N° registro" style="grid-column:3/4"><input data-i="${i}" data-k="notes" value="${attr(e.notes)}" placeholder="Observaciones" style="grid-column:4/6"></div>`).join('')||'<div class="empty">Sin equipos registrados en este centro.</div>'}
function collectEq(){document.querySelectorAll('#equipmentEditor [data-i]').forEach(el=>{const i=+el.dataset.i,k=el.dataset.k;data.centers[currentCenter].equipment[i][k]=el.value})}
function delEq(i){collectEq();data.centers[currentCenter].equipment.splice(i,1);renderEqEditor()}
function renderPhotos(){const c=data.centers[currentCenter];photoGrid.innerHTML=c.photos.map((p,i)=>`<div class="photo"><img src="${p.data}" alt="Foto"><button onclick="delPhoto(${i})">×</button></div>`).join('')}
function delPhoto(i){data.centers[currentCenter].photos.splice(i,1);renderPhotos()}
async function addPhotos(files){for(const f of files){const dataUrl=await compressImage(f);data.centers[currentCenter].photos.push({name:f.name,data:dataUrl})}renderPhotos()}
function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image(),r=new FileReader();r.onload=e=>{img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};img.src=e.target.result};r.onerror=reject;r.readAsDataURL(file)})}
function saveCurrentCenter(){collectEq();const c=data.centers[currentCenter];c.novelties=cNov.value;c.works=cWorks.value;c.pending=cPending.value;c.companies=cCompanies.value;c.observations=cObs.value;c.plants.osmosis={status:osmosisStatus.value,detail:osmosisDetail.value};c.plants.treatment={status:treatmentStatus.value,detail:treatmentDetail.value};c.feeding={blower:fBlower.value,selectors:fSelectors.value,dosers:fDosers.value,screw:fScrew.value,vfd:fVfd.value,notes:fNotes.value};save();closeCenter()}
function delRequest(i){data.requests.splice(i,1);save()}
function restoreHistory(i){const h=data.history||[];if(!h[i])return;if(confirm('¿Abrir este informe? El informe actual se reemplazará, pero seguirá archivado.')){const hist=data.history;data=JSON.parse(JSON.stringify(h[i]));data.history=hist;save();init();switchTab('summary')}}
function newWeekly(){syncMeta();const snapshot=JSON.parse(JSON.stringify({...data,history:undefined}));data.history=data.history||[];data.history.unshift(snapshot);const hist=data.history;data=newReport();data.history=hist;data.meta.zone=snapshot.meta.zone;data.meta.mechanic=snapshot.meta.mechanic;save();init();switchTab('summary')}
function backupJSON(){syncMeta();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='multix-mantencion-respaldo.json';a.click();URL.revokeObjectURL(a.href)}
function buildPrint(){syncMeta();const parts=[];parts.push(`<h1 class="pr-title">INFORME TÉCNICO SEMANAL DE MANTENCIÓN</h1><div class="pr-sub">Área Mantención – ${esc(data.meta.zone)}</div><div class="pr-meta"><div><b>FECHA</b>${esc(data.meta.end)}</div><div><b>PERIODO</b>${esc(data.meta.start)} al ${esc(data.meta.end)}</div><div><b>ÁREA</b>${esc(data.meta.area)}</div><div><b>MECÁNICO EN EL ÁREA</b>${esc(data.meta.mechanic)}</div></div>`);CENTER_NAMES.forEach(n=>{const c=data.centers[n];const has=c.novelties||c.works||c.pending||c.companies||c.observations||c.equipment.length||c.photos.length||c.plants.osmosis.status!=='Sin información'||c.plants.treatment.status!=='Sin información'||Object.values(c.feeding).some(v=>v&&v!=='Sin información');if(!has)return;parts.push(`<div class="pr-center"><h2>${esc(n.toUpperCase())}</h2>`);if(c.novelties)parts.push(prText('Novedades',c.novelties));if(c.works)parts.push(prText('Trabajos realizados',c.works));if(c.equipment.length){parts.push(`<div class="pr-section"><h3>Equipos</h3><table class="pr-table"><thead><tr><th>Equipo</th><th>Actual</th><th>Últ. mant.</th><th>Próxima</th><th>Estado</th></tr></thead><tbody>${c.equipment.map(e=>`<tr><td>${esc(e.name||e.type)}${e.reg?`<br><small>N° registro: ${esc(e.reg)}</small>`:''}${e.notes?`<br><small>${esc(e.notes)}</small>`:''}</td><td>${esc(e.current)}</td><td>${esc(e.last)}</td><td>${esc(e.next)}</td><td>${esc(e.status)}</td></tr>`).join('')}</tbody></table></div>`)}const pp=[];if(c.plants.treatment.status!=='Sin información')pp.push(`<b>Planta de Tratamiento:</b> ${esc(c.plants.treatment.status)}${c.plants.treatment.detail?' — '+esc(c.plants.treatment.detail):''}`);if(c.plants.osmosis.status!=='Sin información')pp.push(`<b>Planta de Ósmosis:</b> ${esc(c.plants.osmosis.status)}${c.plants.osmosis.detail?' — '+esc(c.plants.osmosis.detail):''}`);if(pp.length)parts.push(`<div class="pr-section"><h3>Plantas</h3><p>${pp.join('<br>')}</p></div>`);const fv=[['Blower',c.feeding.blower],['Selectoras',c.feeding.selectors],['Doser',c.feeding.dosers],['Tornillo',c.feeding.screw],['Variadores',c.feeding.vfd]].filter(x=>x[1]&&x[1]!=='Sin información');if(fv.length||c.feeding.notes)parts.push(`<div class="pr-section"><h3>Sistema de alimentación</h3><p>${fv.map(x=>`${x[0]}: ${esc(x[1])}`).join(' · ')}${c.feeding.notes?'<br>'+esc(c.feeding.notes):''}</p></div>`);if(c.pending)parts.push(prText('Trabajos pendientes',c.pending));if(c.companies)parts.push(prText('Empresas en terreno',c.companies));if(c.observations)parts.push(prText('Observaciones',c.observations));if(c.photos.length)parts.push(`<div class="pr-section"><h3>Fotografías</h3><div class="pr-photos">${c.photos.map(p=>`<img src="${p.data}">`).join('')}</div></div>`);const req=data.requests.filter(r=>r.center===n);if(req.length)parts.push(`<div class="pr-section"><h3>Solicitudes y requerimientos</h3><table class="pr-table"><thead><tr><th>Equipo</th><th>Material / repuesto</th><th>Solicitado a</th><th>Fecha</th><th>Estado</th></tr></thead><tbody>${req.map(r=>`<tr><td>${esc(r.equipment)}</td><td>${esc(r.material)}</td><td>${esc(r.requestedTo)}</td><td>${esc(r.date)}</td><td>${esc(r.status)}</td></tr>`).join('')}</tbody></table></div>`);parts.push('</div>')});printReport.innerHTML=parts.join('')}
function prText(h,t){return `<div class="pr-section"><h3>${h}</h3><p>${esc(t).replace(/\n/g,'<br>')}</p></div>`}
function switchTab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id))}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));$('saveBtn').onclick=save;$('pdfBtn').onclick=()=>{save();buildPrint();setTimeout(()=>window.print(),150)};$('newBtn').onclick=()=>{if(confirm('Se archivará el informe actual y se creará uno nuevo. ¿Continuar?'))newWeekly()};$('closeEditor').onclick=closeCenter;$('saveCenter').onclick=saveCurrentCenter;$('addEquipment').onclick=()=>{collectEq();data.centers[currentCenter].equipment.push({name:'',type:'',current:'',last:'',next:'',reg:'',status:'OK',notes:''});renderEqEditor()};photoInput.onchange=e=>addPhotos([...e.target.files]).then(()=>e.target.value='');$('addRequest').onclick=()=>{data.requests.push({center:rCenter.value,equipment:rEquip.value,material:rMaterial.value,requestedTo:rTo.value,date:rDate.value,status:rStatus.value});rEquip.value=rMaterial.value=rTo.value='';save()};$('backupBtn').onclick=backupJSON;$('restoreInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const parsed=JSON.parse(ev.target.result);if(!parsed.centers)throw 0;data=parsed;save();init();alert('Respaldo cargado correctamente.')}catch(_){alert('El archivo no corresponde a un respaldo válido.')}};r.readAsText(f);e.target.value=''};[startDate,endDate,zone,mechanic].forEach(el=>el.addEventListener('change',save));init();
</script>
